name: Build ESP32-C3 Firmware & Merge Binary

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-merge:
    name: Compile & Generate Merged 0x0 Binary
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install platformio esptool
          fi

      - name: Cache PlatformIO Core & Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Compile Firmware via PlatformIO
        run: |
          pio run

      - name: Verify or Generate Merged Binary
        run: |
          BUILD_DIR=".pio/build/esp32-c3-supermini"
          MERGED_BIN="$BUILD_DIR/esp32c3_st7789_merged_0x0.bin"
          
          # If the post-build script didn't generate it, generate here directly
          if [ ! -f "$MERGED_BIN" ]; then
            echo "Generating merged binary with esptool directly..."
            python -m esptool --chip esp32c3 merge_bin \
              -o "$MERGED_BIN" \
              --flash_mode dio \
              --flash_freq 80m \
              --flash_size 4MB \
              0x0000 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0x10000 "$BUILD_DIR/firmware.bin"
          fi
          
          echo "=========================================="
          echo "SUCCESS: Merged 0x0 Binary Created:"
          ls -lh "$MERGED_BIN"
          echo "=========================================="

      - name: Upload Single 0x0 Flashable Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3_st7789_merged_0x0
          path: .pio/build/esp32-c3-supermini/esp32c3_st7789_merged_0x0.bin
          if-no-files-found: error

      - name: Upload All Binary Packages (Diagnostic)
        uses: actions/upload-artifact@v4
        with:
          name: all-esp32c3-binaries
          path: |
            .pio/build/esp32-c3-supermini/*.bin
