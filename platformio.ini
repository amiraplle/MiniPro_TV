; PlatformIO Project Configuration for ESP32-C3 Super Mini + ST7789 (GMT130 V1.0)
;
; This configuration compiles the C++ hardware firmware in firmware/
; and automatically produces a single merged 0x0 binary via scripts/merge_bin.py

[platformio]
default_envs = esp32-c3-supermini
src_dir = firmware/src
include_dir = firmware/include

[env:esp32-c3-supermini]
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
framework = arduino

; Optimize CPU & Flash Clock
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

monitor_speed = 115200

; CRITICAL: USB CDC on boot enables Serial output via native USB-C
build_flags = 
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Automatically runs esptool merge_bin after build to produce esp32c3_st7789_merged_0x0.bin
extra_scripts = post:scripts/merge_bin.py

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
